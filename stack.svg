<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace} .s{font-family:Inter,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
