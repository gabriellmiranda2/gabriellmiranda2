 y="282" width="45" height="30" rx="15" fill="#FFC857" fill-opacity=".1" stroke="#FFC857" stroke-opacity=".4"/><text x="487.0" y="301.5" class="m" font-size="13" fill="#FFC857">SQL</text><rect x="529.4" y="282" width="61" height="30" rx="15" fill="#FFC857" fill-opacity=".1" stroke="#FFC857" stroke-opacity=".4"/><text x="540.4" y="301.5" class="m" font-size="13" fill="#FFC857">MySQL</text><rect x="856.0" y="24" width="384" height="312" rx="16" fill="#0F1626" stroke="#1F2A44"/><rect x="856.0" y="24" width="384" height="4" rx="2" fill="#A78BFA"/><text x="884.0" y="70" class="m" font-size="13" fill="#A78BFA" letter-spacing="1.5">PRODUTO · UX</text><text x="884.0" y="112" class="s" font-size="26" font-weight="800" fill="#E6EDF3">App contra</text><text x="884.0" y="144" class="s" font-size="26" font-weight="800" fill="#E6EDF3">o etarismo</text><text x="884.0" y="186" class="m" font-size="14" fill="#8B98B0">Protótipo de aplicativo de</text><text x="884.0" y="210" class="m" font-size="14" fill="#8B98B0">inclusão social para pessoas</text><text x="884.0" y="234" class="m" font-size="14" fill="#8B98B0">idosas.</text><rect x="884.0" y="282" width="61" height="30" rx="15" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".4"/><text x="895.0" y="301.5" class="m" font-size="13" fill="#A78BFA">Figma</text><rect x="953.0" y="282" width="38" height="30" rx="15" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".4"/><text x="964.0" y="301.5" class="m" font-size="13" fill="#A78BFA">UX</text></svg>
